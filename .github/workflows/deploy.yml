name: Django CI/CD

on:
  push:
    branches: [ "feature" ]
  pull_request:
    branches: [ "feature" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 12345
          POSTGRES_DB: base_one
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d base_one"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Wait for DB
      run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for Postgres..."
            sleep 2
          done

    - name: Run migrations
      env:
        DATABASE_NAME: base_one
        DATABASE_USER: postgres
        DATABASE_PASSWORD: 12345
        DATABASE_HOST: localhost
        DATABASE_PORT: 5432
      run: |
        python manage.py migrate

    - name: Run tests
      env:
        DATABASE_NAME: base_one
        DATABASE_USER: postgres
        DATABASE_PASSWORD: 12345
        DATABASE_HOST: localhost
        DATABASE_PORT: 5432
        REDIS_HOST: localhost
        REDIS_PORT: 6379
      run: |
        python manage.py test
